name: autofix.ci

on:
  pull_request:
  push:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Fix lint errors
        run: ruff check --fix-only .

      - name: Format code
        run: ruff format .

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a